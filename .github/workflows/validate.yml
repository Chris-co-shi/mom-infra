name: Validate infrastructure

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: v5.8.1
  KUBECONFORM_VERSION: v0.7.0
  GITLEAKS_VERSION: v8.30.1

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install validators
        run: |
          python -m pip install --disable-pip-version-check yamllint PyYAML
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}
          go install github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}
          go install github.com/gitleaks/gitleaks/v8@${GITLEAKS_VERSION}
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Validate repository
        run: ./scripts/validate.sh

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Install validators
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check yamllint PyYAML
          go install "sigs.k8s.io/kustomize/kustomize/v5@$env:KUSTOMIZE_VERSION"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@$env:KUBECONFORM_VERSION"
          go install "github.com/gitleaks/gitleaks/v8@$env:GITLEAKS_VERSION"
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
